[package]
name = "project-flow"
version = "0.1.3"
description = "Local-first desktop project planning for Windows"
authors = ["ProjectFlow contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "project_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
shared-dev-data = []
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
zip = { version = "8.6.0", default-features = false }
sha2 = "0.11.0"
uuid = { version = "1.26.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["clock", "std"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
